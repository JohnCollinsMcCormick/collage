<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camo News Collage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #news-camo-wrapper {
      position: relative;
      width: 1027px;
      height: 1027px;
      margin: 24px;
      background: #000;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    #news-camo-controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 11px;
    }

    #news-camo-controls button {
      border: none;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: #eee;
      color: #111;
    }

    #news-camo-controls button:hover {
      opacity: 0.85;
    }

    #news-camo-status {
      opacity: 0.8;
    }

    #news-camo-collage {
      display: block;
      width: 1027px;
      height: 1027px;
    }
  </style>
</head>
<body>
  <div id="news-camo-wrapper">
    <div id="news-camo-controls">
      <button id="news-camo-regenerate">Regenerate</button>
      <span id="news-camo-status">Loading collage…</span>
    </div>
    <canvas id="news-camo-collage" width="1027" height="1027"></canvas>
  </div>

  <script>
    (function() {
      // Topical queries – closer to your original categories
      const topics = [
        'breaking news',
        'fashion runway',
        'advertising billboard',
        'contemporary architecture',
        'professional sports',
        'political rally',
        'stock market trading floor',
        'war conflict',
        'police officers',
        'ICE immigration enforcement',
        'border crossing immigration'
      ];

      // Camo overlays – approximate “every nation / era” with different environments
      const camoTopics = [
        'military camouflage pattern',
        'forest military camouflage',
        'desert military camouflage',
        'urban digital camouflage',
        'naval ship camouflage',
        'snow arctic camouflage',
        'jungle camouflage uniform'
      ];

      const rotationsDeg = [0, 15, 45, 90, 180];

      function initNewsCamoCollage() {
        const canvas = document.getElementById('news-camo-collage');
        const statusEl = document.getElementById('news-camo-status');
        const regenerateBtn = document.getElementById('news-camo-regenerate');
        const ctx = canvas.getContext('2d');

        const W = canvas.width = 1027;
        const H = canvas.height = 1027;

        function randomItem(arr) {
          return arr[Math.floor(Math.random() * arr.length)];
        }

        // Unsplash random by topic – no API key required
        function buildUnsplashUrl(query) {
          // using 900x900, topic-specific search query
          return 'https://source.unsplash.com/900x900/?' + encodeURIComponent(query);
        }

        function loadImage(url) {
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => {
              console.warn('Image failed:', url);
              resolve(null); // resolve null so we can still proceed
            };
            img.src = url;
          });
        }

        async function fetchImages() {
          const mainPromises = topics.map(t => loadImage(buildUnsplashUrl(t)));
          const camoPromises = Array.from({ length: 5 }, () =>
            loadImage(buildUnsplashUrl(randomItem(camoTopics)))
          );

          const mainSet = await Promise.all(mainPromises);
          const camoSet = await Promise.all(camoPromises);

          const main = mainSet.filter(Boolean);
          const camo = camoSet.filter(Boolean);

          return { main, camo };
        }

        function drawFallbackAbstract() {
          // Draw *something* visible if all external images fail
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, W, H);

          for (let i = 0; i < 40; i++) {
            const x = Math.random() * W;
            const y = Math.random() * H;
            const w = 80 + Math.random() * 260;
            const h = 80 + Math.random() * 260;
            const angle = randomItem(rotationsDeg) * Math.PI / 180;

            const r = 80 + Math.floor(Math.random() * 175);
            const g = 80 + Math.floor(Math.random() * 175);
            const b = 80 + Math.floor(Math.random() * 175);

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = `rgba(${r},${g},${b},${0.6 + Math.random()*0.4})`;
            ctx.fillRect(-w/2, -h/2, w, h);
            ctx.restore();
          }

          ctx.fillStyle = '#fff';
          ctx.font = '14px system-ui, sans-serif';
          ctx.fillText('Fallback abstract collage (no external images)', 20, H - 20);
        }

        function draw(mainImages, camoImages) {
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.filter = 'none';
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, W, H);

          if (!mainImages.length) {
            drawFallbackAbstract();
            return;
          }

          const numTiles = Math.max(18, Math.floor(mainImages.length * 2));

          for (let i = 0; i < numTiles; i++) {
            const img = randomItem(mainImages);
            if (!img) continue;

            const scale = 0.25 + Math.random() * 0.55;
            const tileW = W * scale;
            const tileH = H * (0.3 + Math.random() * 0.4);

            const x = Math.random() * (W - tileW);
            const y = Math.random() * (H - tileH);

            const angle = randomItem(rotationsDeg) * Math.PI / 180;

            const invert = Math.random() < 0.6 ? 1 : 0;
            const contrast = 1 + Math.random() * 0.8;
            const brightness = 0.8 + Math.random() * 0.6;

            ctx.save();
            ctx.translate(x + tileW / 2, y + tileH / 2);
            ctx.rotate(angle);

            ctx.filter = `invert(${invert}) contrast(${contrast}) brightness(${brightness})`;
            ctx.globalAlpha = 0.7 + Math.random() * 0.3;

            ctx.drawImage(img, -tileW / 2, -tileH / 2, tileW, tileH);
            ctx.restore();
          }

          // Camo overlay mask
          if (camoImages.length) {
            ctx.save();
            ctx.globalCompositeOperation = randomItem([
              'multiply', 'overlay', 'soft-light', 'darken', 'hard-light'
            ]);
            ctx.globalAlpha = 0.75;

            const tileSize = 420;

            for (let cx = 0; cx < W + tileSize; cx += tileSize * 0.8) {
              for (let cy = 0; cy < H + tileSize; cy += tileSize * 0.8) {
                const camo = randomItem(camoImages);
                if (!camo) continue;

                ctx.save();
                ctx.translate(cx + tileSize / 2, cy + tileSize / 2);
                ctx.rotate(randomItem(rotationsDeg) * Math.PI / 180);

                const s = 0.8 + Math.random() * 0.6;
                const w = tileSize * s;
                const h = tileSize * s;

                ctx.drawImage(camo, -w / 2, -h / 2, w, h);
                ctx.restore();
              }
            }

            ctx.restore();
          }

          // Vignette
          const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 700);
          g.addColorStop(0, 'rgba(0, 0, 0, 0)');
          g.addColorStop(1, 'rgba(0, 0, 0, 0.9)');

          ctx.save();
          ctx.globalCompositeOperation = 'multiply';
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }

        async function generate() {
          statusEl.textContent = 'Loading collage…';
          try {
            const { main, camo } = await fetchImages();
            draw(main, camo);
            statusEl.textContent = main.length
              ? 'Collage ready'
              : 'Fallback collage (no external images)';
          } catch (e) {
            console.error(e);
            statusEl.textContent = 'Error loading images.';
            drawFallbackAbstract();
          }
        }

        regenerateBtn.addEventListener('click', generate);
        generate();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initNewsCamoCollage);
      } else {
        initNewsCamoCollage();
      }
    })();
  </script>
</body>
</html>
