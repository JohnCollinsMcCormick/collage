<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camo Mask News Collage (Local Images)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #news-camo-wrapper {
      position: relative;
      width: 1027px;
      height: 1027px;
      margin: 24px;
      background: #000;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    #news-camo-controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 11px;
    }

    #news-camo-controls button {
      border: none;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: #eee;
      color: #111;
    }

    #news-camo-controls button:hover {
      opacity: 0.85;
    }

    #news-camo-status {
      opacity: 0.8;
    }

    #news-camo-collage {
      display: block;
      width: 1027px;
      height: 1027px;
    }
  </style>
</head>
<body>
  <div id="news-camo-wrapper">
    <div id="news-camo-controls">
      <button id="news-camo-regenerate">Regenerate</button>
      <span id="news-camo-status">Loading collage…</span>
    </div>
    <canvas id="news-camo-collage" width="1027" height="1027"></canvas>
  </div>

  <script>
    (function() {
      // === 1. DEFINE YOUR LOCAL IMAGE SETS HERE ===========================
      // These paths are relative to index.html in your repo.
      // Make sure the filenames match what you upload into /images/main and /images/camo.

      const mainImagePaths = [
        // news / fashion / architecture / sports / politics / war / police / ICE / immigration etc.
        'images/main/news1.jpg',
        'images/main/news2.jpg',
        'images/main/war1.jpg',
        'images/main/police1.jpg',
        'images/main/immigration1.jpg',
        'images/main/finance1.jpg',
        'images/main/protest1.jpg',
        'images/main/fashion1.jpg',
        'images/main/architecture1.jpg'
        // add more as you upload: 'images/main/filename.jpg',
      ];

      const camoImagePaths = [
        'images/camo/camo1.jpg',
        'images/camo/camo2.jpg',
        'images/camo/camo3.jpg',
        'images/camo/camo4.jpg'
        // add more: 'images/camo/another-camo.jpg',
      ];

      const rotationsDeg = [0, 15, 45, 90, 180];

      function initNewsCamoCollage() {
        const canvas = document.getElementById('news-camo-collage');
        const statusEl = document.getElementById('news-camo-status');
        const regenerateBtn = document.getElementById('news-camo-regenerate');
        const ctx = canvas.getContext('2d');

        const W = canvas.width = 1027;
        const H = canvas.height = 1027;

        function randomItem(arr) {
          return arr[Math.floor(Math.random() * arr.length)];
        }

        function loadImage(url) {
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => {
              console.warn('Failed to load image:', url);
              resolve(null);
            };
            img.src = url + '?v=' + Date.now(); // cache-buster when you replace files
          });
        }

        async function fetchLocalImages() {
          const mainPromises = mainImagePaths.map(p => loadImage(p));
          const camoPromises = camoImagePaths.map(p => loadImage(p));

          const mainSet = await Promise.all(mainPromises);
          const camoSet = await Promise.all(camoPromises);

          return {
            main: mainSet.filter(Boolean),
            camo: camoSet.filter(Boolean)
          };
        }

        function drawFallbackAbstract() {
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.clearRect(0, 0, W, H);

          for (let i = 0; i < 40; i++) {
            const x = Math.random() * W;
            const y = Math.random() * H;
            const w = 80 + Math.random() * 260;
            const h = 80 + Math.random() * 260;
            const angle = randomItem(rotationsDeg) * Math.PI / 180;

            const r = 80 + Math.floor(Math.random() * 175);
            const g = 80 + Math.floor(Math.random() * 175);
            const b = 80 + Math.floor(Math.random() * 175);

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = `rgba(${r},${g},${b},${0.6 + Math.random()*0.4})`;
            ctx.fillRect(-w/2, -h/2, w, h);
            ctx.restore();
          }

          ctx.fillStyle = '#fff';
          ctx.font = '14px system-ui, sans-serif';
          ctx.fillText('Fallback abstract collage (no local images yet)', 20, H - 20);
        }

        function drawBehindCollage(mainImages) {
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.clearRect(0, 0, W, H);

          if (!mainImages.length) {
            drawFallbackAbstract();
            return;
          }

          const numTiles = Math.max(18, Math.floor(mainImages.length * 2));

          for (let i = 0; i < numTiles; i++) {
            const img = randomItem(mainImages);
            if (!img) continue;

            const scale = 0.25 + Math.random() * 0.55;
            const tileW = W * scale;
            const tileH = H * (0.3 + Math.random() * 0.4);

            const x = Math.random() * (W - tileW);
            const y = Math.random() * (H - tileH);

            const angle = randomItem(rotationsDeg) * Math.PI / 180;
            const invert = Math.random() < 0.6 ? 1 : 0;
            const contrast = 1 + Math.random() * 0.8;
            const brightness = 0.8 + Math.random() * 0.6;

            ctx.save();
            ctx.translate(x + tileW / 2, y + tileH / 2);
            ctx.rotate(angle);

            ctx.filter = `invert(${invert}) contrast(${contrast}) brightness(${brightness})`;
            ctx.globalAlpha = 0.7 + Math.random() * 0.3;

            ctx.drawImage(img, -tileW / 2, -tileH / 2, tileW, tileH);
            ctx.restore();
          }

          ctx.filter = 'none';
          ctx.globalAlpha = 1;
        }

        function drawCamoMaskPattern(camoImages) {
          const tileSize = 420;

          for (let cx = 0; cx < W + tileSize; cx += tileSize * 0.8) {
            for (let cy = 0; cy < H + tileSize; cy += tileSize * 0.8) {
              const camo = randomItem(camoImages);
              if (!camo) continue;

              ctx.save();
              ctx.translate(cx + tileSize / 2, cy + tileSize / 2);
              ctx.rotate(randomItem(rotationsDeg) * Math.PI / 180);

              const s = 0.8 + Math.random() * 0.6;
              const w = tileSize * s;
              const h = tileSize * s;

              ctx.globalAlpha = 1;
              ctx.drawImage(camo, -w/2, -h/2, w, h);
              ctx.restore();
            }
          }
        }

        function applyCamoMask(camoImages) {
          if (!camoImages.length) return; // no mask, full collage visible

          ctx.save();
          ctx.globalCompositeOperation = 'destination-in';
          drawCamoMaskPattern(camoImages);
          ctx.restore();
        }

        function applyVignette() {
          const g = ctx.createRadialGradient(
            W / 2, H / 2, 200,
            W / 2, H / 2, 700
          );
          g.addColorStop(0, 'rgba(0, 0, 0, 0)');
          g.addColorStop(1, 'rgba(0, 0, 0, 0.9)');

          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }

        async function generate() {
          statusEl.textContent = 'Loading local images…';
          try {
            const { main, camo } = await fetchLocalImages();

            drawBehindCollage(main);
            applyCamoMask(camo);
            applyVignette();

            if (!main.length) {
              statusEl.textContent = 'Fallback collage (add images to /images/main)';
            } else if (!camo.length) {
              statusEl.textContent = 'Collage ready (add camo to /images/camo for mask)';
            } else {
              statusEl.textContent = 'Collage + camo mask ready (local images)';
            }

          } catch (e) {
            console.error(e);
            statusEl.textContent = 'Error loading local images.';
            drawFallbackAbstract();
          }
        }

        regenerateBtn.addEventListener('click', generate);
        generate();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initNewsCamoCollage);
      } else {
        initNewsCamoCollage();
      }
    })();
  </script>
</body>
</html>
